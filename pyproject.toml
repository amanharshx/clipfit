[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "clipfit"
version = "0.3.2"
description = "Shrink oversized clipboard images so LLM chats can read them."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "Pillow>=10",
    "pyobjc-framework-Cocoa>=9; sys_platform == 'darwin'",
]

[project.scripts]
clipfit = "clipfit.cli:main"
clipfit-client = "clipfit.client:main"

[tool.setuptools]
packages = ["clipfit"]
