[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "clipfit"
version = "0.1.0"
description = "Shrink oversized clipboard images so LLM chats can read them."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "Pillow>=10",
    "pyobjc-framework-Cocoa>=9; sys_platform == 'darwin'",
]

[project.scripts]
clipfit = "clipfit.cli:main"

[tool.setuptools]
packages = ["clipfit"]
